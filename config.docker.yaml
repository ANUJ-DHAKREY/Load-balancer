server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: 15s
  write_timeout: 15s
  idle_timeout: 60s
  max_retries: 3

admin:
  enabled: true
  host: "0.0.0.0"
  port: 9090

health_check:
  interval: 10s
  timeout: 5s
  path: "/health"

strategy: "round-robin"

rate_limit:
  enabled: true
  rate: 100
  burst_size: 200
  per_ip: true
  cleanup_interval_sec: 300

backends:
  - url: "http://backend1:8080"
    weight: 1
  - url: "http://backend2:8080"
    weight: 1
  - url: "http://backend3:8080"
    weight: 1
