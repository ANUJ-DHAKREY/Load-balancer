server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: 15s
  write_timeout: 15s
  idle_timeout: 60s
  max_retries: 3

admin:
  enabled: true
  host: "127.0.0.1"
  port: 9090

health_check:
  interval: 10s
  timeout: 5s
  path: "/health"

# Strategy options: round-robin, weighted-round-robin, least-connections
strategy: "round-robin"

rate_limit:
  enabled: true
  rate: 100            # requests per second
  burst_size: 200      # max burst
  per_ip: true         # per-IP limiting (false = global)
  cleanup_interval_sec: 300

backends:
  - url: "http://localhost:8081"
    weight: 1
  - url: "http://localhost:8082"
    weight: 1
  - url: "http://localhost:8083"
    weight: 1
